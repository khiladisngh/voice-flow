name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv build
      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for $VERSION" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # Explicit globs, not dist/*: uv build also writes a dist/.gitignore,
          # which GitHub would attach as a bogus "default.gitignore" asset.
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: false
