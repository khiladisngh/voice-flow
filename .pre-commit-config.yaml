# Formatting ownership is split by file type:
#   ruff     -> Python
#   prettier -> Markdown, YAML, JSON
# See [tool.ruff] extend-exclude in pyproject.toml, which keeps ruff out of
# Markdown so the two formatters never fight over the same file.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        description: Format Markdown, YAML, and JSON with the pinned local prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        types_or: [markdown, yaml, json]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--unsafe] # mkdocs.yml uses a !!python/name: tag
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
